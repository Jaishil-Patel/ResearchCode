# Standard-branch room spec. Copy to <room>_spec.yaml and fill in.
#
# This is the Task 3 non-photogrammetric branch: the room as a competent practitioner
# would build it by hand, from the same tape measurements in <room>.csv. Proposal S4.4.2
# requires it to be metrically faithful rather than eyeballed, so every number here
# should trace back to a row in that CSV. It is a derived file -- the CSV is the field
# record, this is the model built from it at a desk.
#
# Consumed by tools/gen_world.py, which turns it into
# ros2_ws/src/pepper_room_description/models/room_standard/model.sdf.
#
# FRAME. The interior of the room is x in [0, length], y in [0, width], floor at z = 0.
# That is exactly the frame tools/mesh_import.py puts the reconstruction in under its
# default --origin-mode floor-min-corner, and the origin corner must be the SAME physical
# corner of the real room in both. If the two branches disagree about where the origin is,
# a start/goal route set expressed in world coordinates describes two different journeys
# and the comparison is meaningless.

room:
  length: 0.00            # interior, along x
  width: 0.00             # interior, along y
  height: 0.00            # floor to ceiling
  wall_thickness: 0.10    # cosmetic; walls are solid boxes outside the interior volume
  floor_thickness: 0.05
  include_ceiling: true   # keep it: it bounds the depth camera's view upward
  mu: 1.0                 # friction, matched to the photogrammetry branch
  mu2: 1.0

# Openings split a wall into segments. Positions run along the wall's own axis in world
# coordinates: x for the y_min/y_max walls, y for the x_min/x_max walls.
openings: []
# openings:
#   - name: door
#     wall: y_min         # x_min | x_max | y_min | y_max
#     start: 1.20
#     end: 2.10
#     bottom: 0.00
#     top: 2.05
#   - name: window
#     wall: x_max
#     start: 1.00
#     end: 2.60
#     bottom: 0.90
#     top: 2.10

# Furniture as bounding boxes. S4.4.2 is explicit that the standard branch represents
# furniture by its bounding shape -- the reconstruction recovering the real surface where
# this does not IS the difference under test, so do not try to model detail here.
# pose is the box CENTRE: [x, y, z] or [x, y, z, yaw_radians].
# Round things (poles, round tables, stools) take `shape: cylinder` with
# size [diameter, diameter, height]; yaw is ignored for them.
furniture: []
# furniture:
#   - name: desk
#     size: [1.60, 0.80, 0.74]
#     pose: [1.20, 0.40, 0.37]
#   - name: cabinet
#     size: [0.90, 0.45, 1.80]
#     pose: [4.80, 3.95, 0.90, 1.5708]
#   - name: pillar
#     shape: cylinder
#     size: [0.30, 0.30, 2.50]
#     pose: [2.00, 2.00, 1.25]

# Optional. Defaults match pepper_robot_ign/worlds/follow_target.sdf; both branches get
# whatever is set here, which is the point.
physics:
  max_step_size: 0.005
  real_time_factor: 1.0
