# Navigation MDP, proposal S4.4.2 and S4.4.3.
#
# This file is IDENTICAL for both branches. The world file is the only thing that differs
# between them -- that is the whole design of the experiment, and train.py hashes this
# file and records the hash in the run directory so a mid-experiment edit to one branch
# cannot pass unnoticed. `tools/gen_world.py --check` applies the same discipline to the
# worlds; this is that habit extended to the agent.

task:
  # The goal is a physical object in the room, not a random point: every episode, in
  # training and evaluation, both branches and the real runs, ends at this item from
  # <room>_spec.yaml's `furniture` list (the red-topped pole). Only the start varies.
  goal_object: goal
  # delta in Eq. 4.1, measured from the goal object's CENTRE. It cannot be small, because
  # the goal is solid: Pepper's centre can get no closer than pole radius (0.05) + base
  # radius (0.24), and the proximity collision proxy (lidar < 0.25 m, lidar 0.056 m ahead
  # of centre) already fires head-on at ~0.36 m. So at the old 0.35 every arrival would
  # score as a collision, never a success. 0.6 = stop within ~25 cm of the pole's surface,
  # with ~0.24 m of margin before the proxy fires.
  goal_tolerance_m: 0.6
  # T_max in Eq. 4.1, in SIMULATED seconds. Sized against the route set: the longest
  # planned l* on test_scan is 10.8 m, which at a sustained 0.25 m/s is 43 s, so 120 s
  # leaves room for turning and recovery without letting a stuck policy burn an episode.
  max_duration_s: 120.0
  # How often the agent acts. Capped in practice by the delivered depth-camera rate --
  # a policy cannot act on observations that have not arrived. Run
  # rl/scripts/bench_throughput.py before trusting this number.
  control_hz: 5.0

action:
  # Pepper's real limits, not the simulator's. NAOqi caps the base at 0.55 m/s, but the
  # proposal's task is indoor navigation near people and the deployment room is shared,
  # so this is deliberately well under it. Reverse is allowed but small: Pepper's depth
  # camera faces forward and it has no rear sensing, so fast reverse is blind.
  v_max_mps: 0.30
  v_min_mps: -0.10
  omega_max_rps: 0.90
  # The real robot's command latency, in control steps, reproduced in SIMULATION only (in
  # training and evaluation alike; the real robot supplies its own). Measured 2 Oct 2026 with
  # tools/base_sysid.py (docs/calib_20261002_0948): command -> 10% of the velocity step took
  # 0.43-1.18 s, median 0.82 s, across straights, reverse, spins and arcs -- through the same
  # bridge + shim + NAOqi chain a deployed policy drives. At 5 Hz that is 4 steps. The
  # simulated base alone responds in ~0.02 s. randomisation.yaml latency_steps is an offset
  # around this, covering the measured spread.
  sim_command_delay_steps: 4

observation:
  # Downsampled from the simulated 320x240. The policy does not need per-pixel detail to
  # navigate, and under software rendering every pixel is CPU-rasterised.
  depth_width: 64
  depth_height: 48
  # Value domain is fixed by tools/pepper_bridge_node.py: SIM_NEAR_CLIP / SIM_FAR_CLIP,
  # with no-return, too-near and too-far all mapped to inf. The env replaces inf with
  # this sentinel, normalised, because a network cannot consume inf. Mapping it to the
  # FAR value is the deliberate choice: "no return" most often means "nothing close",
  # and the alternative -- mapping it to NEAR -- would make the policy flinch at every
  # dark or glossy surface. It is a modelling decision, identical in both branches and
  # in sim and real, and it belongs in the write-up.
  invalid_depth_as: far
  # Goal pose relative to the robot frame (Chaffre et al.): range, and the sin/cos of the
  # bearing. sin/cos rather than the raw angle so the representation has no discontinuity
  # at +-pi, which a policy otherwise has to waste capacity learning around.
  include_goal: true
  # The policy's own last N actions, in its [-1, 1] units, oldest first. Added 7 Oct 2026:
  # with the measured 0.8 s command latency (4 steps, randomised +-2) and the fitted
  # acceleration limits, the robot's motion over the next second is set by commands already
  # sent, which neither the depth image nor the goal vector reveals -- without them the
  # observation is not Markov. Tai et al. [2017] and Chaffre et al. [2020] feed previous
  # velocities back for the same reason. 6 covers the longest randomised delay. Identical on
  # hardware: the env knows what it sent.
  action_history: 6

reward:
  # Following Chaffre et al.'s shaping. Weights are a tuning surface; they must stay
  # identical across branches, which is what the config hash enforces.
  goal_reached: 100.0
  collision: -100.0
  # Per metre of progress toward the goal, measured on straight-line distance. Positive
  # for closing, and symmetric so backing away costs what approaching earns -- an
  # asymmetric version pays a policy to oscillate.
  progress_per_m: 20.0
  # Small per-step cost, so dithering is not free and the policy has a reason to finish.
  step_cost: -0.05
  # Discourages spinning on the spot, which is a common SAC local optimum in navigation:
  # it is safe, never collides, and never arrives.
  angular_cost_per_rps: -0.02

collision:
  # Which source counts as a collision for Eq. 4.1 and Eq. 4.5.
  #   contact   -- the base contact sensor. Ground truth, and what CR should be built on.
  #   proximity -- lidar minimum range below `proximity_threshold_m`. A PROXY, and a
  #                poor one: the front lidar spans 60 degrees, so it cannot see a
  #                collision with the side or rear of the base at all.
  #
  # Currently `proximity`, and not by choice. The contact sensor is real and verified --
  # ign_base_contact (pepper_robot.gazebo) genuinely reports Tibia-vs-room contacts on
  # Ignition Transport, confirmed by reading the raw topic directly against a live sim.
  # What is NOT working is the ROS bridge for it: `ros2 launch` resolves `parameter_bridge`
  # to the system apt package (/opt/ros/humble/lib/...), and that build's factory refuses
  # ros_ign_interfaces/msg/Contacts ("Failed to create a bridge for topic ... with ROS2
  # type [ros_ign_interfaces/msg/Contacts]"). The vendored ros2_ws/src/ros_ign DOES map
  # this (see its ros_ign_bridge/mappings.py), but that whole tree carries a COLCON_IGNORE
  # and has never been built in this workspace -- ros2_ws/log has no build directory for
  # it. Fixing this means either colcon building ros_ign_bridge/ros_ign_interfaces (check
  # first for conflicts with the system package, since IGN_GAZEBO_RESOURCE_PATH and the
  # apt package coexist today) or bridging contact through a small custom node using
  # direct Ignition Transport reads, the way tools/mesh_import.py-adjacent tooling does.
  # Until then: proximity is what actually delivers CR/C_i today, and it must stay the
  # same in both branches, and the choice belongs in the write-up either way.
  # 30 Sep 2026: now `contact`. The bridge problem above is worked around by
  # tools/contact_relay.py (started by rl/sim_process.launch), which reads the Ignition
  # contact topics directly -- no ros_ign_bridge rebuild needed. Contact sensors now cover the
  # base shell, torso, both upper arms, forearms and hands (pepper_robot.gazebo,
  # ign_base_contact), so side and rear bumps count; floor contacts are filtered out.
  source: contact
  proximity_threshold_m: 0.25
  # Tilt from vertical, in degrees, beyond which the episode ends as a COLLISION,
  # whichever `source` is set. Added 28 Sep 2026 after the final_scan smoke test:
  # the lidar proxy cannot see side or rear contact, so reversing into a wall went
  # uncounted until Pepper toppled and lay there for the rest of the episode. The
  # steepest part of the scanned floor is ~6 deg (the ramp beside Box2), so level
  # driving stays well under this; in the traced topple pitch went 12 -> 21 -> 63 deg
  # over consecutive 10 s samples. Counts in CR (Eq. 4.5); state it in the write-up.
  tip_over_deg: 20.0

reset:
  # Seconds of real time to let physics absorb a teleport before the first observation.
  # Teleporting does not zero velocity, so without this the episode's first frame is
  # taken mid-slide.
  settle_s: 0.6
  # Episodes start from the route set during evaluation and from uniform free space
  # during training, so training is not overfitted to 20 particular start poses.
  train_sampling: uniform
